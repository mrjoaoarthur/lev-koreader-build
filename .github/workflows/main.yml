name: Build KOReader (bookeen)

# Build do KOReader para o Saraiva Lev (port oficial "bookeen") na nuvem.
# Usa a imagem de cross-compile de docs/BUILD-KOREADER.md, mas via `docker run` explicito
# (o modo "job container" do Actions falhou ao iniciar; docker run e mais robusto).
#
# Uso: Actions > "Build KOReader (bookeen)" > Run workflow.
# Resultado: artifact "koreader-bookeen" com koreader-bookeen-*.zip + SHA256.txt.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Diagnostico do runner
        run: |
          uname -a
          docker --version
          nproc
          free -h
          df -h /

      - name: Baixar a imagem de cross-compile
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            docker pull koreader/kobookeen:5.0.0-22.04 && break
            echo "pull falhou (tentativa $i), esperando 10s..."; sleep 10
          done
          docker image inspect koreader/kobookeen:5.0.0-22.04 --format '{{.Architecture}} {{.Os}}' | tee /tmp/img_arch.txt
          grep -q amd64 /tmp/img_arch.txt

      - name: Compilar dentro do container
        run: |
          set -euo pipefail
          mkdir -p "$PWD/src" "$PWD/out"
          docker run --rm --user root \
            -v "$PWD/src:/src" \
            -v "$PWD/out:/out" \
            koreader/kobookeen:5.0.0-22.04 \
            bash -lc '
              set -euxo pipefail
              git config --global --add safe.directory "*"
              cd /src
              git clone https://github.com/koreader/koreader.git
              cd koreader
              git checkout 400ba0e65c
              git submodule update --init --depth 1 base
              cd base
              git checkout 33b43b5b21a2f2aa7a8b5ad53b6d83d3954f51c0
              cd ..
              ./kodev fetch-thirdparty
              ./kodev build bookeen
              ./kodev release bookeen
              file luajit
              cp koreader-bookeen-*.zip /out/
              cd /out
              sha256sum koreader-bookeen-*.zip | tee SHA256.txt
            '

      - name: Conferencias finais
        run: |
          set -euo pipefail
          ls -l out/
          unzip -l out/koreader-bookeen-*.zip | head -20
          df -h /

      - name: Publicar artifact
        uses: actions/upload-artifact@v4
        with:
          name: koreader-bookeen
          path: |
            out/koreader-bookeen-*.zip
            out/SHA256.txt
          if-no-files-found: error
          retention-days: 30
